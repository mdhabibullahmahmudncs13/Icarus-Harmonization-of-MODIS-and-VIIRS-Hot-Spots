[project]
name = "icarus"
version = "0.1.0"
description = "Harmonization of MODIS and VIIRS hot spots (NASA Space Apps 2026)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".agents", ".claude"]
